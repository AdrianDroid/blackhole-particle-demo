<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Hole Particle Field — Live Demo</title>
<style>
:root{--panel:rgba(18,18,28,.85);--text:#e8e8f0;--muted:#9898b0;--accent:#7c5cff;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;color:var(--text);font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:none;touch-action:none}
.panel{position:fixed;top:16px;left:16px;z-index:10;width:min(300px,calc(100vw - 32px));padding:14px 16px 16px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.panel h1{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{flex:0 0 72px;font-size:12px;color:var(--muted)}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row .val{flex:0 0 36px;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.row input[type=color]{width:36px;height:28px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button{flex:1 1 auto;min-width:80px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.06);color:var(--text);font-size:12px;font-weight:500;cursor:pointer}
button:hover{background:rgba(124,92,255,.25);border-color:rgba(124,92,255,.45)}
button.primary{background:rgba(124,92,255,.35);border-color:rgba(124,92,255,.55)}
.hint{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.4}
.fps{position:fixed;top:16px;right:16px;z-index:10;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div class="panel">
  <h1>Black Hole Field</h1>
  <div class="row"><label for="count">Particles</label><input id="count" type="range" min="50" max="1200" step="10" value="300" /><span class="val" id="countVal">300</span></div>
  <div class="row"><label for="force">Force</label><input id="force" type="range" min="5" max="100" step="1" value="55" /><span class="val" id="forceVal">55</span></div>
  <div class="row"><label for="bg">Background</label><input id="bg" type="color" value="#0a0a12" /></div>
  <div class="btns">
    <button type="button" id="clearBtn">Clear</button>
    <button type="button" id="resetBtn">Reset</button>
    <button type="button" id="shotBtn" class="primary">Download</button>
  </div>
  <p class="hint">Move to pull inward (Plummer). Particles shrink into the horizon, then respawn far out.</p>
</div>
<div class="fps" id="fps">— fps</div>
<canvas id="c"></canvas>
<script>
(() => {
  const soft = 22;
  const Rh = soft * Math.SQRT2; // ~31

  function createParticle(x, y, rng = Math.random) {
    const ang = rng() * Math.PI * 2;
    const spd = 0.25 + rng() * 1.4; // calmer start so attract wins
    return { x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 0.45 + rng() * 0.85 };
  }
  function createParticles(n, W, H) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(createParticle(Math.random() * W, Math.random() * H));
    return out;
  }
  // F on particle toward attractor: +G * (attractor - p) / (r^2+eps^2)^{3/2}
  function plummerToward(dx, dy, G, fMax) {
    const soft2 = soft * soft;
    const dist2 = dx * dx + dy * dy;
    const denom = Math.pow(dist2 + soft2, 1.5);
    let fx = (G * dx) / denom, fy = (G * dy) / denom;
    const mag = Math.hypot(fx, fy);
    if (fMax > 0 && mag > fMax) { const s = fMax / mag; fx *= s; fy *= s; }
    return { fx, fy };
  }
  function spawnOutside(mx, my, W, H) {
    const minR = 3 * Rh;
    for (let a = 0; a < 32; a++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = minR + Math.random() * Math.max(minR, Math.min(W, H) * 0.3);
      const x = mx + Math.cos(ang) * rad, y = my + Math.sin(ang) * rad;
      if (x >= 0 && x <= W && y >= 0 && y <= H) return createParticle(x, y);
    }
    return createParticle(Math.random() * W, Math.random() < 0.5 ? 0 : H);
  }
  function colorFor(speed, dist) {
    const s = Math.min(speed / 14, 1);
    const d = Math.max(0, 1 - dist / 380);
    const t = Math.min(1, s * 0.5 + d * 0.5);
    return `hsl(${210 - t * 210} ${70 + t * 25}% ${45 + t * 25}%)`;
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const countEl = document.getElementById('count');
  const forceEl = document.getElementById('force');
  const countVal = document.getElementById('countVal');
  const forceVal = document.getElementById('forceVal');
  const bgEl = document.getElementById('bg');
  const fpsEl = document.getElementById('fps');

  let W = 0, H = 0, dpr = 1, particles = [], force = +forceEl.value, bg = bgEl.value;
  let mouse = { x: 0, y: 0, active: false };
  let lastT = performance.now(), frames = 0, fpsAcc = 0;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function pointer(e) {
    const t = e.touches ? e.touches[0] : e;
    if (!t) return;
    mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true;
  }
  addEventListener('resize', resize);
  addEventListener('pointermove', pointer, { passive: true });
  addEventListener('pointerdown', pointer, { passive: true });
  addEventListener('pointerleave', () => { mouse.active = false; });
  addEventListener('touchstart', pointer, { passive: true });
  addEventListener('touchmove', pointer, { passive: true });
  addEventListener('touchend', () => { mouse.active = false; });

  countEl.oninput = () => {
    countVal.textContent = countEl.value;
    const n = +countEl.value;
    if (particles.length > n) particles.length = n;
    while (particles.length < n) particles.push(createParticle(Math.random() * W, Math.random() * H));
  };
  forceEl.oninput = () => { force = +forceEl.value; forceVal.textContent = forceEl.value; };
  bgEl.oninput = () => { bg = bgEl.value; };
  document.getElementById('clearBtn').onclick = () => { particles = []; countVal.textContent = '0'; };
  document.getElementById('resetBtn').onclick = () => {
    particles = createParticles(+countEl.value, W, H);
    countVal.textContent = String(particles.length);
  };
  document.getElementById('shotBtn').onclick = () => {
    const a = document.createElement('a');
    a.download = 'blackhole-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  function step(dt) {
    const mx = mouse.active ? mouse.x : W * 0.5;
    const my = mouse.active ? mouse.y : H * 0.5;
    const attractOn = mouse.active ? 1 : 0.35;
    // Stronger inward pull so attract clearly beats swirl / initial v
    const G = force * 55 * attractOn;
    const fMax = force * 8 * attractOn;
    const next = new Array(particles.length);
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      // vector FROM particle TO attractor (inward)
      const dx = mx - p.x, dy = my - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy) + 1e-4;
      const { fx, fy } = plummerToward(dx, dy, G, fMax);
      p.vx += fx * dt;
      p.vy += fy * dt;
      // Mild swirl only — bias attract over tangential
      if (dist < 160 && dist > Rh * 0.85) {
        const swirl = (1 - dist / 160) * force * 0.012 * attractOn;
        p.vx += (-dy / dist) * swirl * dt;
        p.vy += (dx / dist) * swirl * dt;
      }
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx * dt * 60; p.y += p.vy * dt * 60;
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;

      // Absorb only after clearly inside horizon
      if (mouse.active && Math.hypot(p.x - mx, p.y - my) < Rh * 0.92) {
        p = spawnOutside(mx, my, W, H);
      }
      next[i] = p;
    }
    particles = next;
  }

  function draw() {
    const r = parseInt(bg.slice(1, 3), 16), g = parseInt(bg.slice(3, 5), 16), b = parseInt(bg.slice(5, 7), 16);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${r},${g},${b},0.2)`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const speed = Math.hypot(p.vx, p.vy);
      const dist = mouse.active ? Math.hypot(mouse.x - p.x, mouse.y - p.y) : 200;
      const col = colorFor(speed, dist);
      const len = Math.min(14, 2 + speed * 1.8);
      const nx = speed > 0.05 ? p.vx / speed : 0, ny = speed > 0.05 ? p.vy / speed : 0;
      ctx.beginPath(); ctx.strokeStyle = col; ctx.lineWidth = Math.max(0.5, p.r * 0.9); ctx.lineCap = 'round';
      ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - nx * len, p.y - ny * len); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle = col; ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (mouse.active) {
      ctx.globalCompositeOperation = 'source-over';
      const grd = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, Rh * 1.6);
      grd.addColorStop(0, 'rgba(0,0,0,0.8)');
      grd.addColorStop(0.4, 'rgba(40,20,80,0.28)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, Rh * 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.strokeStyle = 'rgba(180,160,255,0.45)'; ctx.lineWidth = 1.25;
      ctx.arc(mouse.x, mouse.y, Rh, 0, Math.PI * 2); ctx.stroke();
    }
  }

  function frame(t) {
    const dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;
    step(dt); draw();
    frames++; fpsAcc += dt;
    if (fpsAcc >= 0.4) {
      fpsEl.textContent = Math.round(frames / fpsAcc) + ' fps · ' + particles.length + ' p';
      frames = 0; fpsAcc = 0;
    }
    requestAnimationFrame(frame);
  }

  resize();
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  particles = createParticles(+countEl.value, W, H);
  mouse.x = W * 0.5; mouse.y = H * 0.5;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
