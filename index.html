<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schwarzschild Null Geodesic — Emergent Photon Ring</title>
<style>
:root{--bg:#0a0a12;--panel:rgba(18,18,28,.85);--text:#e8e8f0;--muted:#9898b0;--accent:#7c5cff;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.panel{position:fixed;top:16px;left:16px;z-index:10;width:min(320px,calc(100vw - 32px));padding:14px 16px 16px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.panel h1{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.row label{flex:0 0 88px;font-size:12px;color:var(--muted)}
.row input[type=range]{flex:1;accent-color:var(--accent)}
.row .val{flex:0 0 40px;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.row input[type=color]{width:36px;height:28px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button{flex:1 1 auto;min-width:80px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:rgba(255,255,255,.06);color:var(--text);font-size:12px;font-weight:500;cursor:pointer}
button:hover{background:rgba(124,92,255,.25);border-color:rgba(124,92,255,.45)}
button.primary{background:rgba(124,92,255,.35);border-color:rgba(124,92,255,.55)}
.hint{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.45}
.fps{position:fixed;top:16px;right:16px;z-index:10;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;backdrop-filter:blur(10px);max-width:280px;text-align:right}
</style>
</head>
<body>
<div class="panel">
  <h1>Null Geodesic BH v1.0</h1>
  <div class="row"><label for="count">Particles</label><input id="count" type="range" min="40" max="600" step="10" value="180" /><span class="val" id="countVal">180</span></div>
  <div class="row"><label for="nearCrit" title="Fraction with |b|≈bc">Near-crit %</label><input id="nearCrit" type="range" min="40" max="95" step="1" value="78" /><span class="val" id="nearCritVal">78</span></div>
  <div class="row"><label for="simSpeed" title="Affine-time scale">Sim speed</label><input id="simSpeed" type="range" min="15" max="120" step="5" value="45" /><span class="val" id="simSpeedVal">45</span></div>
  <div class="row"><label for="bg">Background</label><input id="bg" type="color" value="#0a0a12" /></div>
  <div class="btns">
    <button type="button" id="clearBtn">Clear</button>
    <button type="button" id="resetBtn">Reset</button>
    <button type="button" id="shotBtn" class="primary">Download PNG</button>
  </div>
  <p class="hint">Fixed BH · RK4 null geodesics · E²=ṙ²+Veff · ring only from near-bc windings at Rγ=3M. No painted ring, no orbit seeds.</p>
</div>
<div class="fps" id="fps">— fps</div>
<canvas id="c"></canvas>
<script>
(() => {
  // Schwarzschild null analog (Math Master Veff; EOM uses geodesic ½ factor so E²=ṙ²+Veff is conserved)
  // Rh=Rs=2M, Rγ=3M, Veff=L²(1-Rs/r)/r²
  // ṙ̈ = −½ ∂Veff/∂r = ½ L²/r⁴ (2r−3Rs), φ̇=L/r²
  // bc=3√3 M; b<bc capture; b>bc scatter; b≈bc windings → emergent ring

  const M = 36;
  const Rs = 2 * M;
  const Rh = Rs;
  const Rgamma = 3 * M;
  const bc = 3 * Math.sqrt(3) * M;
  const E0 = 1.0;
  const TRAIL_LEN = 100;
  const FADE = 0.045;

  function veff(r, L) {
    if (r <= Rs * 1.001) return Infinity;
    return (L * L) * (1 - Rs / r) / (r * r);
  }

  // Geodesic second-order form consistent with ṙ² + Veff = E²
  function rDdot(r, L) {
    if (r < 1e-6) return 0;
    const r2 = r * r;
    return 0.5 * (L * L) / (r2 * r2) * (2 * r - 3 * Rs);
  }

  function energy2(r, vr, L) {
    return vr * vr + veff(r, L);
  }

  function sampleImpactParam(nearFrac) {
    const u = Math.random();
    const sign = Math.random() < 0.5 ? 1 : -1;
    let bAbs;
    if (u < nearFrac) bAbs = (0.97 + Math.random() * 0.06) * bc;
    else if (u < nearFrac + (1 - nearFrac) * 0.5) bAbs = (0.40 + Math.random() * 0.45) * bc;
    else bAbs = (1.15 + Math.random() * 0.70) * bc;
    return sign * bAbs;
  }

  function spawnBeam(cx, cy, W, H, nearFrac) {
    const b = sampleImpactParam(nearFrac);
    const r0x = Math.max(7.5 * Rh, Math.min(W, H) * 0.42);
    const E = E0;
    const L = -b * E;
    const r = Math.hypot(r0x, b);
    const phi = Math.atan2(b, -r0x);
    const vr = (-r0x * E) / r;
    return {
      r, phi, vr, L, b, E,
      E2: energy2(r, vr, L),
      trail: [],
      alive: true,
      size: 0.9 + Math.random() * 0.7,
    };
  }

  function toCart(p, cx, cy) {
    return { x: cx + p.r * Math.cos(p.phi), y: cy + p.r * Math.sin(p.phi) };
  }

  function createParticles(n, cx, cy, W, H, nearFrac) {
    const out = [];
    for (let i = 0; i < n; i++) out.push(spawnBeam(cx, cy, W, H, nearFrac));
    return out;
  }

  function colorForB(b) {
    const db = Math.abs(Math.abs(b) - bc) / bc;
    const t = Math.max(0, 1 - db / 0.14);
    return { h: 210 - t * 175, s: 55 + t * 40, l: 48 + t * 22, t };
  }

  function deriv(r, phi, vr, L) {
    return [vr, L / (r * r), rDdot(r, L)];
  }

  function rk4Step(p, h) {
    const L = p.L;
    const { r, phi, vr } = p;
    const k1 = deriv(r, phi, vr, L);
    const k2 = deriv(r + 0.5 * h * k1[0], phi + 0.5 * h * k1[1], vr + 0.5 * h * k1[2], L);
    const k3 = deriv(r + 0.5 * h * k2[0], phi + 0.5 * h * k2[1], vr + 0.5 * h * k2[2], L);
    const k4 = deriv(r + h * k3[0], phi + h * k3[1], vr + h * k3[2], L);
    p.r   = r   + (h / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    p.phi = phi + (h / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    p.vr  = vr  + (h / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
  }

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const countEl = document.getElementById('count');
  const nearEl = document.getElementById('nearCrit');
  const speedEl = document.getElementById('simSpeed');
  const countVal = document.getElementById('countVal');
  const nearVal = document.getElementById('nearCritVal');
  const speedVal = document.getElementById('simSpeedVal');
  const bgEl = document.getElementById('bg');
  const fpsEl = document.getElementById('fps');

  let W = 0, H = 0, dpr = 1, particles = [];
  let nearFrac = +nearEl.value / 100;
  let simSpeed = +speedEl.value / 100;
  let bg = bgEl.value;
  let lastT = performance.now(), frames = 0, fpsAcc = 0;
  let driftMax = 0, driftAcc = 0, driftN = 0;

  function bhCenter() { return { cx: W * 0.5, cy: H * 0.5 }; }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize);

  countEl.oninput = () => {
    countVal.textContent = countEl.value;
    const n = +countEl.value;
    const { cx, cy } = bhCenter();
    if (particles.length > n) particles.length = n;
    while (particles.length < n) particles.push(spawnBeam(cx, cy, W, H, nearFrac));
  };
  nearEl.oninput = () => { nearFrac = +nearEl.value / 100; nearVal.textContent = nearEl.value; };
  speedEl.oninput = () => { simSpeed = +speedEl.value / 100; speedVal.textContent = speedEl.value; };
  bgEl.oninput = () => { bg = bgEl.value; };

  document.getElementById('clearBtn').onclick = () => {
    particles = [];
    countVal.textContent = '0';
    countEl.value = '0';
    const { cx, cy } = bhCenter();
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    drawHorizon(cx, cy);
  };
  document.getElementById('resetBtn').onclick = () => {
    if (+countEl.value < 40) { countEl.value = '180'; countVal.textContent = '180'; }
    const { cx, cy } = bhCenter();
    particles = createParticles(+countEl.value, cx, cy, W, H, nearFrac);
    countVal.textContent = String(particles.length);
    driftMax = 0; driftAcc = 0; driftN = 0;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  };
  document.getElementById('shotBtn').onclick = () => {
    const a = document.createElement('a');
    a.download = 'schwarzschild-null-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };

  function integrateParticle(p, dt) {
    let rem = dt;
    const maxSub = 32;
    for (let s = 0; s < maxSub && rem > 1e-10; s++) {
      if (p.r < Rh) { p.alive = false; return; }
      const nearH = p.r < 5 * M;
      const crit = Math.abs(p.r - Rgamma) < 0.8 * M;
      let h = rem;
      if (crit) h = Math.min(rem, dt / 16);
      else if (nearH) h = Math.min(rem, dt / 6);
      rk4Step(p, h);
      if (!(p.r > 0) || !Number.isFinite(p.r) || !Number.isFinite(p.vr)) {
        p.alive = false; return;
      }
      rem -= h;
    }
    if (p.r < Rh || p.r > Math.max(W, H) * 0.95) p.alive = false;
  }

  function step(dt) {
    const { cx, cy } = bhCenter();
    const h = dt * simSpeed * 22;
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      integrateParticle(p, h);
      if (!p.alive) {
        p = spawnBeam(cx, cy, W, H, nearFrac);
        particles[i] = p;
        continue;
      }
      if (p.r > Rs * 1.05) {
        const e2 = energy2(p.r, p.vr, p.L);
        if (p.E2 > 1e-12 && Number.isFinite(e2)) {
          const d = Math.abs(e2 - p.E2) / p.E2;
          driftAcc += d; driftN++;
          if (d > driftMax) driftMax = d;
        }
      }
      const c = toCart(p, cx, cy);
      if (!p.trail) p.trail = [];
      p.trail.push({ x: c.x, y: c.y });
      if (p.trail.length > TRAIL_LEN) p.trail.shift();
    }
  }

  function drawHorizon(cx, cy) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Rh * 1.1);
    g.addColorStop(0, 'rgba(0,0,0,0.98)');
    g.addColorStop(0.78, 'rgba(0,0,0,0.86)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, Rh * 1.1, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    const rr = parseInt(bg.slice(1, 3), 16);
    const gg = parseInt(bg.slice(3, 5), 16);
    const bb = parseInt(bg.slice(5, 7), 16);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${rr},${gg},${bb},${FADE})`;
    ctx.fillRect(0, 0, W, H);

    const { cx, cy } = bhCenter();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (const p of particles) {
      const trail = p.trail;
      if (!trail || trail.length < 2) continue;
      const col = colorForB(p.b);
      const n = trail.length;
      for (let i = 1; i < n; i++) {
        const a = (i / n) * (0.16 + col.t * 0.55);
        ctx.beginPath();
        ctx.strokeStyle = `hsla(${col.h},${col.s}%,${col.l}%,${a})`;
        ctx.lineWidth = 0.6 + col.t * 1.2;
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
    }

    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const col = colorForB(p.b);
      const c = toCart(p, cx, cy);
      ctx.beginPath();
      ctx.fillStyle = `hsla(${col.h},${col.s}%,${Math.min(78, col.l + 8)}%,${0.45 + col.t * 0.5})`;
      ctx.arc(c.x, c.y, p.size * (0.8 + col.t * 0.4), 0, Math.PI * 2);
      ctx.fill();
    }

    drawHorizon(cx, cy);
  }

  function frame(t) {
    const dt = Math.min(0.033, (t - lastT) / 1000);
    lastT = t;
    step(dt);
    draw();
    frames++; fpsAcc += dt;
    if (fpsAcc >= 0.5) {
      const avg = driftN ? driftAcc / driftN : 0;
      fpsEl.textContent =
        Math.round(frames / fpsAcc) + ' fps · ' + particles.length +
        ' p · ΔE² ' + avg.toExponential(1);
      frames = 0; fpsAcc = 0;
      driftAcc = 0; driftN = 0; driftMax = 0;
    }
    requestAnimationFrame(frame);
  }

  resize();
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  {
    const { cx, cy } = bhCenter();
    particles = createParticles(+countEl.value, cx, cy, W, H, nearFrac);
    drawHorizon(cx, cy);
  }
  requestAnimationFrame(frame);

  window.__BH__ = { M, Rs, Rh, Rgamma, bc, rDdot, veff, energy2 };
})();
</script>
</body>
</html>
